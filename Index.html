<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>Kedarnath • Badrinath Trip Countdown</title>

<style>
*{box-sizing:border-box}

html,body{
  margin:0;
  min-height:100%;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif
}

body{
  background:#07101c;
  color:white
}

.page{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 15%,#31506c,#142b44 30%,#081321 75%)
}

.sky{
  position:absolute;
  inset:0;
  opacity:.55;
  background-image:
    radial-gradient(circle at 12% 18%,white 0 1px,transparent 2px),
    radial-gradient(circle at 28% 9%,white 0 1px,transparent 2px),
    radial-gradient(circle at 53% 20%,white 0 1px,transparent 2px),
    radial-gradient(circle at 78% 12%,white 0 1px,transparent 2px),
    radial-gradient(circle at 90% 29%,white 0 1px,transparent 2px),
    radial-gradient(circle at 67% 35%,white 0 1px,transparent 2px)
}

.moon{
  position:absolute;
  right:10%;
  top:8%;
  width:78px;
  height:78px;
  border-radius:50%;
  background:#fff3cf;
  box-shadow:0 0 50px #fff3cf33
}

.content{
  position:relative;
  z-index:4;
  width:min(980px,94vw);
  text-align:center;
  padding:35px 0 175px
}

.om{
  font-size:30px;
  opacity:.9;
  margin-bottom:10px
}

.kicker{
  font-size:clamp(11px,2vw,16px);
  letter-spacing:.4em;
  text-transform:uppercase;
  opacity:.6;
  margin-bottom:12px
}

h1{
  font-size:clamp(35px,7vw,72px);
  line-height:1;
  margin:0;
  font-weight:850;
  text-shadow:0 5px 28px #0008
}

.subtitle{
  font-size:clamp(16px,3vw,25px);
  letter-spacing:.25em;
  text-transform:uppercase;
  opacity:.78;
  margin:16px 0 40px
}

.countdown{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px
}

.box{
  background:#050d18c9;
  border:1px solid #ffffff22;
  border-radius:22px;
  padding:24px 6px 18px;
  backdrop-filter:blur(10px);
  box-shadow:0 18px 50px #0005
}

.number{
  font-size:clamp(42px,9vw,86px);
  font-weight:850;
  line-height:1;
  font-variant-numeric:tabular-nums
}

.label{
  font-size:clamp(9px,1.6vw,13px);
  letter-spacing:.2em;
  opacity:.5;
  margin-top:11px
}

.date{
  font-size:clamp(14px,2.5vw,22px);
  font-weight:700;
  letter-spacing:.08em;
  margin-top:30px
}

.journey{
  font-size:13px;
  letter-spacing:.14em;
  opacity:.48;
  margin-top:9px
}

/* Himalayan mountains */
.mountains{
  position:absolute;
  left:0;
  right:0;
  bottom:0;
  height:32%;
  z-index:2;
  background:
    linear-gradient(
      135deg,
      transparent 0 18%,
      #0b1929 18% 28%,
      transparent 28% 40%,
      #10243a 40% 52%,
      transparent 52% 64%,
      #08121f 64% 76%,
      transparent 76%
    )
}

.mountains:after{
  content:"";
  position:absolute;
  inset:auto 0 0;
  height:45%;
  background:#07111d
}

/* Simple temple silhouette */
.temple{
  position:absolute;
  z-index:5;
  bottom:62px;
  left:50%;
  transform:translateX(-50%);
  width:110px;
  height:105px
}

.temple .roof{
  position:absolute;
  top:5px;
  left:5px;
  width:100px;
  height:55px;
  background:#091522;
  clip-path:polygon(50% 0,100% 100%,0 100%)
}

.temple .body{
  position:absolute;
  top:47px;
  left:25px;
  width:60px;
  height:54px;
  background:#091522
}

.temple .door{
  position:absolute;
  bottom:0;
  left:43px;
  width:24px;
  height:38px;
  background:#040a10;
  border-radius:14px 14px 0 0
}

.temple .flag{
  position:absolute;
  left:54px;
  top:-25px;
  width:3px;
  height:35px;
  background:#091522
}

.temple .flag:after{
  content:"";
  position:absolute;
  left:2px;
  top:0;
  border-top:7px solid transparent;
  border-bottom:7px solid transparent;
  border-left:24px solid #091522
}

.footer{
  position:absolute;
  bottom:18px;
  z-index:6;
  font-size:10px;
  letter-spacing:.2em;
  opacity:.35
}

@media(max-width:600px){

  .content{
    padding-bottom:145px
  }

  .countdown{
    gap:6px
  }

  .box{
    padding:18px 3px 15px;
    border-radius:15px
  }

  .subtitle{
    margin-bottom:28px
  }

  .date{
    letter-spacing:.03em
  }

  .moon{
    width:58px;
    height:58px
  }
}
</style>
</head>

<body>

<div class="page">

  <div class="sky"></div>
  <div class="moon"></div>

  <main class="content">

    <div class="om">ॐ</div>

    <div class="kicker">
      Our Himalayan Journey
    </div>

    <h1>
      Kedarnath • Badrinath
    </h1>

    <div class="subtitle">
      Trip Countdown
    </div>

    <section class="countdown" aria-label="Live countdown">

      <div class="box">
        <div class="number" id="days">00</div>
        <div class="label">DAYS</div>
      </div>

      <div class="box">
        <div class="number" id="hours">00</div>
        <div class="label">HOURS</div>
      </div>

      <div class="box">
        <div class="number" id="minutes">00</div>
        <div class="label">MINUTES</div>
      </div>

      <div class="box">
        <div class="number" id="seconds">00</div>
        <div class="label">SECONDS</div>
      </div>

    </section>

    <div class="date">
      17 OCTOBER 2026 • 6:00 PM
    </div>

    <div class="journey" id="journey">
      THE JOURNEY BEGINS
    </div>

  </main>

  <div class="mountains"></div>

  <div class="temple" aria-hidden="true">
    <div class="flag"></div>
    <div class="roof"></div>
    <div class="body"></div>
    <div class="door"></div>
  </div>

  <div class="footer">
    KEDARNATH • BADRINATH • HIMALAYAS
  </div>

</div>

<script>

const target =
  Date.parse("2026-10-17T18:00:00+05:30");

const daysElement =
  document.getElementById("days");

const hoursElement =
  document.getElementById("hours");

const minutesElement =
  document.getElementById("minutes");

const secondsElement =
  document.getElementById("seconds");

const journeyElement =
  document.getElementById("journey");


function updateCountdown(){

  let remaining =
    Math.max(0, target - Date.now());

  let days =
    Math.floor(remaining / 86400000);

  remaining -= days * 86400000;

  let hours =
    Math.floor(remaining / 3600000);

  remaining -= hours * 3600000;

  let minutes =
    Math.floor(remaining / 60000);

  remaining -= minutes * 60000;

  let seconds =
    Math.floor(remaining / 1000);


  daysElement.textContent =
    String(days).padStart(2,"0");

  hoursElement.textContent =
    String(hours).padStart(2,"0");

  minutesElement.textContent =
    String(minutes).padStart(2,"0");

  secondsElement.textContent =
    String(seconds).padStart(2,"0");


  if(Date.now() >= target){

    journeyElement.textContent =
      "THE JOURNEY HAS BEGUN";

  }

}


updateCountdown();

setInterval(updateCountdown,1000);

</script>

</body>
</html>
