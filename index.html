<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061325">
<meta property="og:title" content="Kedarnath • Badrinath Trip">
<meta property="og:description" content="Live countdown to 17 October 2026 • 6:00 PM">
<title>Kedarnath • Badrinath Trip Countdown</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#020914}
body{display:flex;justify-content:center;font-family:Georgia,"Times New Roman",serif}
.page{
 position:relative;width:min(100vw,520px);min-height:100vh;overflow:hidden;
 background:#061325 center top/cover no-repeat url("kedarnath-badrinath-background.jpg");
}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#02081710 0%,#02081700 65%,#02081755 100%)}
.overlay{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;padding:9.5% 4.5% 5%}
.kicker{margin-top:12%;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.34em;color:#e9a936;text-transform:uppercase;text-shadow:0 2px 8px #000}
h1{margin:4% 0 0;color:#fff;font-size:clamp(34px,10vw,55px);line-height:.98;text-align:center;font-weight:700;text-shadow:0 3px 15px #000}
.subtitle{margin:4% 0 5%;font:800 clamp(14px,4vw,19px)/1.2 system-ui,sans-serif;letter-spacing:.22em;color:#ffc45b;text-transform:uppercase;text-shadow:0 2px 8px #000}
.countdown{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{height:145px;border:1px solid #d9a84b88;border-radius:17px;background:linear-gradient(145deg,#061a31f5,#030d1df5);box-shadow:0 12px 30px #0007;display:flex;flex-direction:column;align-items:center;justify-content:center}
.icon{height:22px;color:#f2ad38;font:22px/1 system-ui,sans-serif}
.number{margin-top:7px;font:700 clamp(42px,12vw,61px)/.95 Georgia,serif;color:#fff;font-variant-numeric:tabular-nums}
.label{margin-top:8px;font:800 10px/1 system-ui,sans-serif;letter-spacing:.22em;color:#ffc45b}
.event{margin-top:4.5%;width:100%;padding:12px 4px;text-align:center;border-top:1px solid #d9a84b80;border-bottom:1px solid #d9a84b80;background:#061325d9;color:#fff;font:800 clamp(13px,3.7vw,18px)/1.25 system-ui,sans-serif;letter-spacing:.055em}
.journey{margin-top:9px;color:#fff;background:#061325c0;padding:5px 14px;font:700 11px/1 system-ui,sans-serif;letter-spacing:.18em}
@media(max-width:380px){
 .overlay{padding-left:3.5%;padding-right:3.5%}.box{height:132px}.countdown{gap:7px}
 .kicker{margin-top:11%}.subtitle{margin-bottom:4%}
}
</style>
</head>
<body>
<div class="page">
  <div class="overlay">
    <div class="kicker">OUR HIMALAYAN JOURNEY</div>
    <h1>Kedarnath • Badrinath</h1>
    <div class="subtitle">TRIP COUNTDOWN</div>

    <section class="countdown" aria-label="Live countdown">
      <div class="box"><div class="icon">▣</div><div class="number" id="days">00</div><div class="label">DAYS</div></div>
      <div class="box"><div class="icon">◷</div><div class="number" id="hours">00</div><div class="label">HOURS</div></div>
      <div class="box"><div class="icon">⌛</div><div class="number" id="minutes">00</div><div class="label">MINUTES</div></div>
      <div class="box"><div class="icon">◴</div><div class="number" id="seconds">00</div><div class="label">SECONDS</div></div>
    </section>

    <div class="event">17 OCTOBER 2026&nbsp; • &nbsp;6:00 PM</div>
    <div class="journey" id="journey">THE JOURNEY BEGINS</div>
  </div>
</div>

<script>
(function(){
  const target=Date.parse("2026-10-17T18:00:00+05:30");
  const ids=["days","hours","minutes","seconds"];
  function update(){
    let x=Math.max(0,target-Date.now());
    const d=Math.floor(x/86400000); x-=d*86400000;
    const h=Math.floor(x/3600000); x-=h*3600000;
    const m=Math.floor(x/60000); x-=m*60000;
    const s=Math.floor(x/1000);
    [d,h,m,s].forEach((v,i)=>document.getElementById(ids[i]).textContent=String(v).padStart(2,"0"));
    if(target<=Date.now())document.getElementById("journey").textContent="THE JOURNEY HAS BEGUN";
  }
  update(); setInterval(update,1000);
})();
</script>
</body>
</html>
