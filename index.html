<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#061325">
<meta property="og:title" content="Kedarnath • Badrinath Trip">
<meta property="og:description" content="Live countdown to 17 October 2026 • 6:00 PM">
<title>Kedarnath • Badrinath Trip Countdown</title>
<style>
:root{
  --gold:#e9a936;
  --gold2:#ffc45b;
  --white:#fff;
  --navy:#061325;
  --panel:#06162a;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Georgia,"Times New Roman",serif;background:#06101d;color:#fff}
body{display:flex;justify-content:center}
.page{
  position:relative;width:min(100%,520px);min-height:100vh;overflow:hidden;
  background:
    radial-gradient(circle at 50% 22%,#16395d 0,#09223d 30%,#061325 67%,#030a12 100%);
}
.stars{position:absolute;inset:0;opacity:.75;background-image:
 radial-gradient(circle at 8% 8%,#fff 0 1px,transparent 1.6px),
 radial-gradient(circle at 22% 16%,#fff 0 1px,transparent 1.6px),
 radial-gradient(circle at 40% 7%,#fff 0 1px,transparent 1.5px),
 radial-gradient(circle at 61% 13%,#fff 0 1px,transparent 1.6px),
 radial-gradient(circle at 82% 7%,#fff 0 1px,transparent 1.5px),
 radial-gradient(circle at 93% 23%,#fff 0 1px,transparent 1.6px),
 radial-gradient(circle at 74% 30%,#fff 0 1px,transparent 1.5px),
 radial-gradient(circle at 12% 34%,#fff 0 1px,transparent 1.5px);
}
.moon{
 position:absolute;right:7%;top:4.5%;width:58px;height:58px;border-radius:50%;
 background:#fff1c7;box-shadow:0 0 35px #fff1c755;
}
.main{
 position:relative;z-index:4;text-align:center;padding:30px 14px 0;
}
.om{font-size:44px;line-height:1;color:var(--gold);text-shadow:0 0 20px #e9a93655}
.kicker{margin-top:7px;font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.35em;color:var(--gold2)}
.rule{height:1px;width:55%;margin:10px auto 15px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h1{
 margin:0;color:#fff;font-size:clamp(35px,10vw,54px);line-height:.98;font-weight:700;
 text-shadow:0 3px 18px #0009;
}
.subtitle{
 margin:14px 0 23px;font:700 clamp(14px,4vw,19px)/1.2 system-ui,sans-serif;
 letter-spacing:.24em;color:var(--gold2);
}
.countdown{
 display:grid;grid-template-columns:repeat(2,1fr);gap:9px;max-width:470px;margin:auto;
}
.box{
 min-width:0;padding:14px 5px 12px;border:1px solid #d9a84b66;border-radius:15px;
 background:linear-gradient(145deg,#071a31e8,#030d1ce8);
 box-shadow:0 10px 28px #0006,inset 0 1px #fff10;
}
.icon{height:20px;color:var(--gold);font:20px/1 system-ui,sans-serif}
.number{margin-top:5px;font:700 clamp(39px,11vw,58px)/.95 Georgia,serif;font-variant-numeric:tabular-nums}
.label{margin-top:7px;font:700 10px/1 system-ui,sans-serif;letter-spacing:.22em;color:var(--gold2)}
.event{
 margin:18px auto 0;max-width:470px;padding:11px 5px;border-top:1px solid #d9a84b55;border-bottom:1px solid #d9a84b55;
 font:700 14px/1.3 system-ui,sans-serif;letter-spacing:.08em;
}
.journey{margin-top:9px;font:11px/1.2 system-ui,sans-serif;letter-spacing:.18em;color:#fff9}
.mountains{
 position:absolute;z-index:1;left:0;right:0;bottom:0;height:39%;
 background:
  linear-gradient(145deg,transparent 0 13%,#0d2943 13% 23%,transparent 23% 36%,#12304c 36% 47%,transparent 47% 60%,#0a2036 60% 72%,transparent 72%);
}
.mountains:before{
 content:"";position:absolute;inset:25% 0 0;
 background:
  linear-gradient(125deg,transparent 0 24%,#071522 24% 43%,transparent 43% 54%,#091a2c 54% 78%,transparent 78%);
}
.temple{
 position:absolute;z-index:3;bottom:67px;left:50%;transform:translateX(-50%);
 width:180px;height:145px;filter:drop-shadow(0 2px 12px #0009);
}
.temple .tower{
 position:absolute;left:56px;top:17px;width:67px;height:91px;
 background:linear-gradient(90deg,#172536,#273b4c 48%,#121f2d);
 clip-path:polygon(12% 100%,0 14%,50% 0,100% 14%,88% 100%);
}
.temple .roof{
 position:absolute;left:37px;top:0;width:105px;height:43px;background:#101d2b;
 clip-path:polygon(50% 0,100% 100%,0 100%);
}
.temple .body{
 position:absolute;left:28px;right:28px;bottom:0;height:74px;background:#142536;
 clip-path:polygon(0 18%,50% 0,100% 18%,94% 100%,6% 100%);
}
.temple .door{
 position:absolute;left:77px;bottom:0;width:27px;height:42px;background:#050b12;border-radius:15px 15px 0 0;
}
.temple .light{
 position:absolute;left:84px;top:63px;width:13px;height:13px;border-radius:50%;background:#ffc45b;
 box-shadow:0 0 22px #ffc45b;
}
.temple .flagpole{position:absolute;left:88px;top:-25px;width:2px;height:28px;background:#e9a936}
.temple .flagpole:after{
 content:"";position:absolute;left:2px;top:0;border-top:5px solid transparent;border-bottom:5px solid transparent;border-left:18px solid var(--gold);
}
.bottom{
 position:absolute;z-index:5;bottom:16px;left:0;right:0;text-align:center;
 font:700 9px/1 system-ui,sans-serif;letter-spacing:.25em;color:#fff8;
}
@media(min-height:800px){
 .main{padding-top:38px}
 .countdown{gap:10px}
 .box{padding-top:16px;padding-bottom:14px}
}
@media(max-width:360px){
 .main{padding-top:22px}
 .om{font-size:36px}.subtitle{margin-bottom:18px}
 .box{padding-top:11px;padding-bottom:10px}
 .number{font-size:37px}
 .event{margin-top:13px}
 .temple{bottom:55px;transform:translateX(-50%) scale(.82)}
}
@media(prefers-reduced-motion:no-preference){
 .moon{animation:moon 6s ease-in-out infinite}
 @keyframes moon{50%{box-shadow:0 0 48px #fff1c766}}
}
</style>
</head>
<body>
<div class="page">
<div class="stars"></div><div class="moon"></div>
<main class="main">
  <div class="om">ॐ</div>
  <div class="kicker">OUR HIMALAYAN JOURNEY</div>
  <div class="rule"></div>
  <h1>Kedarnath • Badrinath</h1>
  <div class="subtitle">TRIP COUNTDOWN</div>

  <section class="countdown" aria-label="Live countdown">
    <div class="box"><div class="icon">▣</div><div class="number" id="days">00</div><div class="label">DAYS</div></div>
    <div class="box"><div class="icon">◷</div><div class="number" id="hours">00</div><div class="label">HOURS</div></div>
    <div class="box"><div class="icon">⌛</div><div class="number" id="minutes">00</div><div class="label">MINUTES</div></div>
    <div class="box"><div class="icon">◴</div><div class="number" id="seconds">00</div><div class="label">SECONDS</div></div>
  </section>

  <div class="event">17 OCTOBER 2026 &nbsp;•&nbsp; 6:00 PM</div>
  <div class="journey" id="journey">THE JOURNEY BEGINS</div>
</main>

<div class="mountains"></div>
<div class="temple" aria-hidden="true">
  <div class="flagpole"></div><div class="roof"></div><div class="tower"></div>
  <div class="body"></div><div class="door"></div><div class="light"></div>
</div>
<div class="bottom">KEDARNATH • BADRINATH • HIMALAYAS</div>

<script>
(function(){
  // 17 October 2026, 6:00 PM IST (UTC+05:30)
  const target=Date.parse("2026-10-17T18:00:00+05:30");
  const els=[
    document.getElementById("days"),
    document.getElementById("hours"),
    document.getElementById("minutes"),
    document.getElementById("seconds")
  ];
  function update(){
    let x=Math.max(0,target-Date.now());
    const d=Math.floor(x/86400000); x-=d*86400000;
    const h=Math.floor(x/3600000); x-=h*3600000;
    const m=Math.floor(x/60000); x-=m*60000;
    const s=Math.floor(x/1000);
    [d,h,m,s].forEach((v,i)=>els[i].textContent=String(v).padStart(2,"0"));
    if(target<=Date.now()) document.getElementById("journey").textContent="THE JOURNEY HAS BEGUN";
  }
  update();
  setInterval(update,1000);
})();
</script>
</div>
</body>
</html>
